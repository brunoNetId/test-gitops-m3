apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: {{ .Values.devworkspace.name }}
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
spec:
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.{{ .Values.devspaces.namespace }}.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  routingClass: che
  started: true
  template:
    attributes:
      controller.devfile.io/storage-type: per-workspace
    commands:
      - exec:
          commandLine: >-
            source ~/.bashrc &&
            jbang trust add https://github.com/apache/camel/ &&
            jbang app install -Dcamel.jbang.version={{ .Values.devworkspace.camelVersion }} camel@apache/camel &&
            jbang camel@apache/camel plugin add kubernetes &&
            jbang camel@apache/camel plugin add forage --gav io.kaoto.forage:camel-jbang-plugin-forage:1.5.0-SNAPSHOT &&
            jbang camel@apache/camel plugin get
          component: tools
        id: set-camel-cli
      - exec:
          commandLine: 'echo -e "export LAB_SCRIPTS=/projects/workshop/tools/scripts\nexport PATH=\$LAB_SCRIPTS:\$PATH\nsource setup" >> ~/.bashrc'
          component: tools
        id: setup-lab-default
      - exec:
          commandLine: 'cp -n /projects/workshop/tools/solution/steps/7/mcp-servers/camel-quarkus/settings.xml $HOME/.m2'
          component: tools
        id: config-settings-snapshot
    components:
      - container:
          endpoints:
            - exposure: public
              name: 8080-tcp
              protocol: https
              secure: true
              targetPort: 8080
          env:
            - name: MAVEN_CONFIG
              value: ''
            - name: JAVA_OPTS
              value: '-XX:MaxRAMPercentage=50.0 -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -Dsun.zip.disableMemoryMapping=true -Xms20m -Djava.security.egd=file:/dev/./urandom -Duser.home=/home/user'
            - name: MAVEN_OPTS
              value: $(JAVA_OPTS)
            {{- if .Values.cluster.appsDomain }}
            - name: CHE_DASHBOARD_URL
              value: https://devspaces.{{ .Values.cluster.appsDomain }}/dashboard/
            - name: CLUSTER_CONSOLE_TITLE
              value: OpenShift Console
            - name: CLUSTER_CONSOLE_URL
              value: https://console-openshift-console.{{ .Values.cluster.appsDomain }}/topology/ns/{{ include "user-workload.namespace" . }}?view=graph
            {{- end }}
            - name: VSCODE_TRUSTED_EXTENSIONS
              value: "redhat.vscode-kaoto"
          image: {{ .Values.devworkspace.image }}
          memoryLimit: {{ .Values.devworkspace.memoryLimit }}
          sourceMapping: /projects
          volumeMounts:
            - name: m2
              path: /home/user/.m2
        name: tools
      - name: m2
        volume:
          size: {{ .Values.devworkspace.m2VolumeSize }}
    events:
      postStart:
        - set-camel-cli
        - setup-lab-default
        - config-settings-snapshot
    projects:
      - name: workshop
        git:
          checkoutFrom:
            revision: {{ .Values.devworkspace.gitBranch }}
          remotes:
            origin: {{ .Values.devworkspace.gitRepo }}
