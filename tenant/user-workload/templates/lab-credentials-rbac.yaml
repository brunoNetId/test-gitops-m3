apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-credentials-patcher
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lab-credentials"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-credentials-patcher
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-credentials-patcher
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "user-workload.namespace" . }}
