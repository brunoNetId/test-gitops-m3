apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-credentials-patcher
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lab-credentials", "lab-config", "camel-credentials"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-credentials-patcher
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-credentials-patcher
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "user-workload.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-credentials-reader-{{ .Values.tenant.username }}
  namespace: {{ .Values.connectivityLink.kuadrantNamespace }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-maas", "m3-api-key-silver-{{ .Values.tenant.username }}", "m3-api-key-gold-{{ .Values.tenant.username }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-credentials-reader-{{ .Values.tenant.username }}
  namespace: {{ .Values.connectivityLink.kuadrantNamespace }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-credentials-reader-{{ .Values.tenant.username }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "user-workload.namespace" . }}
