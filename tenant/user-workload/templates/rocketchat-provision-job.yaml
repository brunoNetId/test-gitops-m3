apiVersion: batch/v1
kind: Job
metadata:
  name: rc-provision-{{ .Values.tenant.username }}
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: rc-provision
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e

              RC_URL="http://rocketchat.{{ .Values.rocketchat.namespace }}.svc.cluster.local:3000"
              ADMIN_USER="{{ .Values.rocketchat.admin.username }}"
              ADMIN_PASS="{{ .Values.rocketchat.admin.password }}"
              USERNAME="{{ .Values.tenant.username }}"
              USER_PASS="{{ .Values.tenant.password }}"
              ROOM_NAME="{{ include "user-workload.roomname" . }}"

              # --- Step 1: Wait for RocketChat to be ready ---
              echo "Waiting for RocketChat..."
              until curl -sf "${RC_URL}/api/v1/info" > /dev/null 2>&1; do
                echo "  RocketChat not ready, retrying in 5s..."
                sleep 5
              done
              echo "RocketChat is ready."

              # --- Step 2: Login as admin ---
              echo "Logging in as admin..."
              RESPONSE=$(curl -sf "${RC_URL}/api/v1/login" \
                -H 'Content-Type: application/json' \
                -d "{\"user\":\"${ADMIN_USER}\",\"password\":\"${ADMIN_PASS}\"}")

              ADMIN_ID=$(echo "$RESPONSE" | sed -n 's/.*"userId":"\([^"]*\)".*/\1/p')
              ADMIN_TOKEN=$(echo "$RESPONSE" | sed -n 's/.*"authToken":"\([^"]*\)".*/\1/p')
              if [ -z "$ADMIN_TOKEN" ]; then
                echo "ERROR: Failed to get admin auth token"
                exit 1
              fi
              echo "Admin login successful."

              # --- Step 3: Create user ---
              echo "Creating RocketChat user '${USERNAME}'..."
              RESPONSE=$(curl -s -w "\n%{http_code}" "${RC_URL}/api/v1/users.create" \
                -H 'Content-Type: application/json' \
                -H "X-User-Id: ${ADMIN_ID}" \
                -H "X-Auth-Token: ${ADMIN_TOKEN}" \
                -d "{
                  \"name\": \"${USERNAME}\",
                  \"email\": \"${USERNAME}@user.tld\",
                  \"username\": \"${USERNAME}\",
                  \"password\": \"${USER_PASS}\"
                }")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [ "$HTTP_CODE" = "200" ]; then
                echo "User '${USERNAME}' created successfully."
              elif echo "$BODY" | grep -q "already in use"; then
                echo "User '${USERNAME}' already exists (OK)."
              else
                echo "ERROR: Failed to create user (HTTP ${HTTP_CODE}): ${BODY}"
                exit 1
              fi

              # --- Step 4: Create private channel ---
              echo "Creating private channel '${ROOM_NAME}'..."
              RESPONSE=$(curl -s -w "\n%{http_code}" "${RC_URL}/api/v1/groups.create" \
                -H 'Content-Type: application/json' \
                -H "X-User-Id: ${ADMIN_ID}" \
                -H "X-Auth-Token: ${ADMIN_TOKEN}" \
                -d "{
                  \"name\": \"${ROOM_NAME}\",
                  \"members\": [\"${USERNAME}\"]
                }")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Channel '${ROOM_NAME}' created successfully."
              elif echo "$BODY" | grep -q "error-duplicate-channel-name"; then
                echo "Channel '${ROOM_NAME}' already exists (OK)."
              else
                echo "ERROR: Failed to create channel (HTTP ${HTTP_CODE}): ${BODY}"
                exit 1
              fi

              # --- Step 5: Create outgoing webhook ---
              R2K_URL="http://r2k.{{ include "user-workload.namespace" . }}.svc:80/webhook"
              echo "Creating outgoing webhook for channel '${ROOM_NAME}'..."
              RESPONSE=$(curl -s -w "\n%{http_code}" "${RC_URL}/api/v1/integrations.create" \
                -H 'Content-Type: application/json' \
                -H "X-User-Id: ${ADMIN_ID}" \
                -H "X-Auth-Token: ${ADMIN_TOKEN}" \
                -d "{
                  \"type\": \"webhook-outgoing\",
                  \"name\": \"${ROOM_NAME} webhook\",
                  \"event\": \"sendMessage\",
                  \"enabled\": true,
                  \"channel\": \"#${ROOM_NAME}\",
                  \"username\": \"${USERNAME}\",
                  \"urls\": [\"${R2K_URL}\"],
                  \"scriptEnabled\": true,
                  \"script\": \"class Script {process_outgoing_response({ request, response }){return false;}}\"
                }")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Webhook created successfully."
              elif echo "$BODY" | grep -q "already exists"; then
                echo "Webhook already exists (OK)."
              else
                echo "WARNING: Webhook creation returned HTTP ${HTTP_CODE}: ${BODY}"
              fi

              # --- Step 6: Create AI Bot user ---
              echo "Creating AI Bot user..."
              RESPONSE=$(curl -s -w "\n%{http_code}" "${RC_URL}/api/v1/users.create" \
                -H 'Content-Type: application/json' \
                -H "X-User-Id: ${ADMIN_ID}" \
                -H "X-Auth-Token: ${ADMIN_TOKEN}" \
                -d "{
                  \"name\": \"AI Bot\",
                  \"email\": \"ai-bot@bot.tld\",
                  \"username\": \"ai-bot\",
                  \"password\": \"ai-bot\",
                  \"roles\": [\"bot\"],
                  \"verified\": true
                }")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [ "$HTTP_CODE" = "200" ]; then
                echo "AI Bot user created."
              elif echo "$BODY" | grep -q "already in use"; then
                echo "AI Bot user already exists (OK)."
              else
                echo "WARNING: AI Bot creation returned HTTP ${HTTP_CODE}: ${BODY}"
              fi

              # --- Step 7: Create AI Support channel ---
              AI_CHANNEL="{{ include "user-workload.ai-support-channel" . }}"
              echo "Creating AI Support channel '${AI_CHANNEL}'..."
              RESPONSE=$(curl -s -w "\n%{http_code}" "${RC_URL}/api/v1/groups.create" \
                -H 'Content-Type: application/json' \
                -H "X-User-Id: ${ADMIN_ID}" \
                -H "X-Auth-Token: ${ADMIN_TOKEN}" \
                -d "{
                  \"name\": \"${AI_CHANNEL}\",
                  \"members\": [\"${USERNAME}\", \"ai-bot\"]
                }")

              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              if [ "$HTTP_CODE" = "200" ]; then
                echo "AI Support channel '${AI_CHANNEL}' created."
              elif echo "$BODY" | grep -q "error-duplicate-channel-name"; then
                echo "AI Support channel '${AI_CHANNEL}' already exists (OK)."
              else
                echo "WARNING: AI Support channel creation returned HTTP ${HTTP_CODE}: ${BODY}"
              fi

              # --- Step 8: Discover workspace service and create AI Support webhook ---
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NAMESPACE="{{ include "user-workload.namespace" . }}"
              KUBE_API="https://kubernetes.default.svc"

              echo "Discovering workspace service..."
              WORKSPACE_SVC=""
              for i in $(seq 1 30); do
                SVC_LIST=$(curl -sSk "$KUBE_API/api/v1/namespaces/$NAMESPACE/services" \
                  -H "Authorization: Bearer $SA_TOKEN")
                WORKSPACE_SVC=$(echo "$SVC_LIST" | grep -o '"name": "workspace[^"]*"' | head -1 | sed 's/"name": "//;s/"//')
                if [ -n "$WORKSPACE_SVC" ]; then
                  break
                fi
                echo "  Workspace service not found, retrying in 5s..."
                sleep 5
              done

              if [ -z "$WORKSPACE_SVC" ]; then
                echo "WARNING: Could not find workspace service — skipping AI Support webhook."
              else
                WORKSPACE_URL="http://${WORKSPACE_SVC}.${NAMESPACE}.svc.cluster.local:8080/ai-support"
                echo "Creating AI Support webhook → ${WORKSPACE_URL}"
                RESPONSE=$(curl -s -w "\n%{http_code}" "${RC_URL}/api/v1/integrations.create" \
                  -H 'Content-Type: application/json' \
                  -H "X-User-Id: ${ADMIN_ID}" \
                  -H "X-Auth-Token: ${ADMIN_TOKEN}" \
                  -d "{
                    \"type\": \"webhook-outgoing\",
                    \"name\": \"${AI_CHANNEL} webhook\",
                    \"event\": \"sendMessage\",
                    \"enabled\": true,
                    \"channel\": \"#${AI_CHANNEL}\",
                    \"username\": \"ai-bot\",
                    \"urls\": [\"${WORKSPACE_URL}\"],
                    \"scriptEnabled\": true,
                    \"script\": \"class Script {prepare_outgoing_request({request}){if(request.data.bot){return;}return request;}}\"
                  }")

                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                BODY=$(echo "$RESPONSE" | sed '$d')

                if [ "$HTTP_CODE" = "200" ]; then
                  echo "AI Support webhook created."
                elif echo "$BODY" | grep -q "already exists"; then
                  echo "AI Support webhook already exists (OK)."
                else
                  echo "WARNING: AI Support webhook creation returned HTTP ${HTTP_CODE}: ${BODY}"
                fi
              fi

              # --- Step 9: Login as user to get credentials ---
              echo "Logging in as ${USERNAME}..."
              RESPONSE=$(curl -sf "${RC_URL}/api/v1/login" \
                -H 'Content-Type: application/json' \
                -d "{\"user\":\"${USERNAME}\",\"password\":\"${USER_PASS}\"}")
              RC_USER_ID=$(echo "$RESPONSE" | sed -n 's/.*"userId":"\([^"]*\)".*/\1/p')
              RC_USER_TOKEN=$(echo "$RESPONSE" | sed -n 's/.*"authToken":"\([^"]*\)".*/\1/p')
              if [ -z "$RC_USER_TOKEN" ]; then
                echo "ERROR: Failed to get user auth token"
                exit 1
              fi
              echo "User login successful (userId: ${RC_USER_ID})."

              # --- Step 10: Store credentials in lab-credentials Secret ---
              echo "Storing RocketChat credentials..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NAMESPACE="{{ include "user-workload.namespace" . }}"
              JSON_DATA=$(printf '{\n  "userId": "%s",\n  "token": "%s",\n  "channel": "%s"\n}' "$RC_USER_ID" "$RC_USER_TOKEN" "$ROOM_NAME")
              B64_DATA=$(printf '%s' "$JSON_DATA" | base64 | tr -d '\n')
              HTTP_CODE=$(curl -sSk -o /dev/null -w "%{http_code}" -X PATCH \
                "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/lab-credentials" \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                -H "Content-Type: application/merge-patch+json" \
                -d '{"data":{"rocketchat.json":"'"${B64_DATA}"'"}}')
              if [ "$HTTP_CODE" = "200" ]; then
                echo "RocketChat credentials stored."
              else
                echo "WARNING: Failed to store credentials (HTTP ${HTTP_CODE})"
              fi

              echo "RocketChat provisioning complete for ${USERNAME}."
