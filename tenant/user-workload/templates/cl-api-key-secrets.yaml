{{- $kuadrantNs := .Values.connectivityLink.kuadrantNamespace }}
{{- $username := .Values.tenant.username }}

{{/* Lookup MaaS key from ExternalSecret-created Secret in kuadrant-system */}}
{{- $maasSecret := lookup "v1" "Secret" $kuadrantNs "vault-maas" }}
{{- $maasKey := "" }}
{{- if $maasSecret }}
  {{- $maasKey = index $maasSecret.data "api_key" | b64dec }}
{{- end }}

{{/* Silver API key: reuse existing or generate new */}}
{{- $silverSecretName := printf "m3-api-key-silver-%s" $username }}
{{- $existingSilver := lookup "v1" "Secret" $kuadrantNs $silverSecretName }}
{{- $silverKey := "" }}
{{- if $existingSilver }}
  {{- $silverKey = index $existingSilver.data "api_key" | b64dec }}
{{- else }}
  {{- $silverKey = printf "silver-%s-%s" $username (randAlphaNum 12) }}
{{- end }}

{{/* Gold API key: reuse existing or generate new */}}
{{- $goldSecretName := printf "m3-api-key-gold-%s" $username }}
{{- $existingGold := lookup "v1" "Secret" $kuadrantNs $goldSecretName }}
{{- $goldKey := "" }}
{{- if $existingGold }}
  {{- $goldKey = index $existingGold.data "api_key" | b64dec }}
{{- else }}
  {{- $goldKey = printf "gold-%s-%s" $username (randAlphaNum 12) }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $silverSecretName }}
  namespace: {{ $kuadrantNs }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
    authorino.kuadrant.io/managed-by: authorino
    app: my-llm-{{ $username }}
  annotations:
    kuadrant.io/groups: silver
    secret.kuadrant.io/user-id: {{ $username | quote }}
    secret.kuadrant.io/upstream-token: "Bearer {{ $maasKey }}"
stringData:
  api_key: {{ $silverKey | quote }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $goldSecretName }}
  namespace: {{ $kuadrantNs }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
    authorino.kuadrant.io/managed-by: authorino
    app: my-llm-{{ $username }}
  annotations:
    kuadrant.io/groups: gold
    secret.kuadrant.io/user-id: {{ $username | quote }}
    secret.kuadrant.io/upstream-token: "Bearer {{ $maasKey }}"
stringData:
  api_key: {{ $goldKey | quote }}
type: Opaque
