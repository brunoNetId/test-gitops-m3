apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Values.namespace }}
  annotations:
    {{- include "shared-database.database-syncwave" . | nindent 4 }}
  labels:
    {{- include "shared-database.labels" . | nindent 4 }}
data:
  init.sh: |
    #!/bin/bash
    psql -U postgres -d {{ .Values.postgres.database }} <<'EOSQL'
    ALTER ROLE {{ .Values.postgres.adminUser }} CREATEROLE;
    GRANT CREATE ON DATABASE {{ .Values.postgres.database }} TO {{ .Values.postgres.adminUser }};
    EOSQL
