{{- if .Values.kafkaInstance.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.kafkaInstance.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.kafkaInstance.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/amq-streams/kafka-instance
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        namespace: {{ .Values.kafkaInstance.namespace }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
